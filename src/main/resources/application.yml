server:
  port: 8081

spring:
  application:
    name: alamano-auth-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/alamano?currentSchema=auth}
    username: ${SPRING_DATASOURCE_USERNAME:auth_app}
    password: ${SPRING_DATASOURCE_PASSWORD:auth_app}
  jpa:
    hibernate:
      ddl-auto: validate   # el esquema lo crea Flyway, no Hibernate
    properties:
      hibernate:
        default_schema: auth
  flyway:
    schemas: auth
    default-schema: auth
    locations: classpath:db/migration

app:
  auth:
    # Politica del proyecto: nada de logins caseros. Con false, /auth/register y /auth/login no existen.
    local-login-enabled: ${LOCAL_LOGIN_ENABLED:false}
  admin:
    # Correos (separados por coma) que entran como ADMIN al iniciar sesion con Google.
    emails: ${ADMIN_EMAILS:}
  jwt:
    private-key-path: ${JWT_PRIVATE_KEY_PATH:./keys/jwt-private.pem}
    public-key-path: ${JWT_PUBLIC_KEY_PATH:./keys/jwt-public.pem}
    expiration-minutes: 60
  google:
    # Client ID de la app en Google Cloud (OAuth 2.0 Client, tipo Web). Sin el, todo id_token se rechaza.
    client-id: ${GOOGLE_CLIENT_ID:}
    jwk-set-uri: ${GOOGLE_JWK_SET_URI:https://www.googleapis.com/oauth2/v3/certs}
    # HU-Q2: el JWT propio emitido tras el login con Google vive 30 minutos o menos.
    expiration-minutes: 30

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
  metrics:
    tags:
      application: ${spring.application.name}
      instance: ${HOSTNAME:local}
    distribution:
      percentiles-histogram:
        http.server.requests: true

logging:
  structured:
    format:
      console: ecs
  level:
    org.springframework.security: INFO
